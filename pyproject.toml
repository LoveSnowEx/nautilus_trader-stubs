[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nautilus_trader-stubs"
version = "1.226.0"
description = "Type stubs for NautilusTrader (Cython interface)"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
authors = [
    { name = "NautilusTrader Contributors" }
]
keywords = ["nautilus", "trader", "stubs", "types", "pyi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial",
]

[project.urls]
Homepage = "https://github.com/LoveSnowEx/nautilus_trader-stubs"
Repository = "https://github.com/LoveSnowEx/nautilus_trader-stubs"


[tool.hatch.build.targets.wheel]
packages =["src/nautilus_trader"]
